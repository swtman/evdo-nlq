    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?bt (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?m) AS ?Modules)
      WHERE {
