  # ---------------------------------------------------------------------------
  - id: ex-013
    source: "notes/draftedQueries.txt#Q13"
    question_english: >
      Which departments (with university and course details) use BOTH book
      94700120 AND books 102070469 or 13909 in 2022?
    question_greek: "Ποια Τμήματα (με Πανεπιστήμιο και Μαθήματα) χρησιμοποιούν ΚΑΙ το βιβλίο 94700120 ΚΑΙ τα βιβλία 102070469 ή 13909 το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?c) AS ?NoOfCourses) (GROUP_CONCAT(?ct;SEPARATOR=", ") AS ?Courses)
      WHERE {
        ?c evdx:title ?ct .
        {
          SELECT DISTINCT ?un ?dn ?c
          WHERE {
            ?b a evdx:Book .
            VALUES ?code {"102070469" "13909"}
            ?b evdx:hasCode ?code .
            ?c a evdx:Course .
            ?c evdx:hasBook ?b .
            ?c evdx:year 2022 .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER EXISTS {
              ?c1 a evdx:Course .
              VALUES ?code1 {"94700120"}
              ?b1 evdx:hasCode ?code1 .
              ?c1 evdx:hasBook ?b1 .
              ?d evdx:hasCourse ?c1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-intersection-by-book
    granularity: department
    comparison_mode: set
    few_shot_priority: 13
    notes: "Department-level intersection. FILTER EXISTS checks some other course offering ?c1 in the same ?d."

  # ---------------------------------------------------------------------------
