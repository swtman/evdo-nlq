  # ---------------------------------------------------------------------------
  # Q22 — traversal-lookup (book metadata: publisher + keywords) — NEW 2026-06-11
  # ---------------------------------------------------------------------------
  - id: ex-022
    source: "handwritten (new for 2026-06-11 schema migration)"
    question_english: >
      For the book with code 94700120, who is the publisher and what
      keywords/topics is it tagged with?
    question_greek: "Για το βιβλίο με κωδικό 94700120, ποιος είναι ο εκδότης και με ποιες λέξεις-κλειδιά/θεματικές είναι σημειωμένο;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT DISTINCT ?bt ?publisherName ?keyword
      WHERE {
        ?b a evdx:Book .
        VALUES ?code { "94700120" }
        ?b evdx:hasCode ?code .
        ?b evdx:title ?bt .
        # Assumption: evdx:publisherName is a property of the Publisher node
        # reached via evdx:hasPublisher (Book -> Publisher), not of the Book
        # itself — confirm against live data once the endpoint recovers.
        OPTIONAL { ?b evdx:hasPublisher ?p . ?p evdx:publisherName ?publisherName . }
        OPTIONAL { ?b evdx:keyword ?keyword . }
      }
    query_shape: traversal-lookup
    granularity: book
    comparison_mode: set
    few_shot_priority: 20
    notes: >
      NEW (2026-06-11): exercises evdx:hasPublisher/evdx:publisherName
      (evdx:Publisher, 1,698 instances) and evdx:keyword (111,700 uses,
      topic/subject tags on books) — both new in the schema migration.
      OPTIONAL is used since not every book has a recorded publisher or
      keyword. Unverified against live data — endpoint was unreachable during
      the migration; re-run once it recovers.
