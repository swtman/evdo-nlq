  # ---------------------------------------------------------------------------
  # Q15 — negative-existence (department) — REPLACED 2026-06-11
  # ---------------------------------------------------------------------------
  - id: ex-015
    source: "notes/draftedQueries.txt#Q15 (reworked for new schema)"
    question_english: >
      Which departments (with their university) offered no courses at all in
      2022 — i.e. were inactive that year?
    question_greek: "Ποια Τμήματα (με το Πανεπιστήμιό τους) δεν πρόσφεραν κανένα μάθημα το 2022 — δηλαδή ήταν ανενεργά εκείνη τη χρονιά;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?dn ?un
      WHERE {
        ?d a evdx:Department .
        ?d evdx:name ?dn .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
        ?u evdx:name ?un .
        FILTER NOT EXISTS {
          ?d evdx:hasCourse ?c .
          ?c evdx:year 2022 .
        }
      }
    query_shape: negative-existence
    granularity: department
    comparison_mode: set
    few_shot_priority: 2
    notes: >
      REPLACED (2026-06-11): the old ex-015 asked about a "study programme with
      no modules", which exercised the now-removed Course(programme)/Module
      distinction. In the flat schema there is no programme layer, so the
      natural department-level negative-existence question is simply "which
      departments had no course offering (evdx:Course) in year X".

  # ---------------------------------------------------------------------------
  # Q16 — negative-existence (university)
  # ---------------------------------------------------------------------------
  - id: ex-016
    source: "notes/draftedQueries.txt#Q16"
    question_english: >
      Which universities had no active courses at all in 2022 — i.e. none of
      their departments offered any course that year?
    question_greek: "Ποια Πανεπιστήμια δεν είχαν κανένα ενεργό μάθημα το 2022 — δηλαδή κανένα Τμήμα τους δεν πρόσφερε μαθήματα εκείνη τη χρονιά;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?un
      WHERE {
        ?u a evdx:University .
        ?u evdx:name ?un .
        FILTER NOT EXISTS {
          ?u evdx:hasDepartment ?d .
          ?d evdx:hasCourse ?c .
          ?c evdx:year 2022 .
        }
      }
    query_shape: negative-existence
    granularity: university
    comparison_mode: set
    few_shot_priority: 15
    notes: >
      FILTER NOT EXISTS spans ?u → ?d → ?c (2 hops, was 3 hops via ?u → ?d → ?c
      → ?m before the migration — the hasModule step is gone since ?c itself
      now carries evdx:year). University-level variant of ex-015. Gold projects
      only ?un (the name) — the IRI ?u was removed to avoid a positional
      column-count mismatch against sensible generated queries that naturally
      project only the name.

  # ---------------------------------------------------------------------------
  # Q17 — ranking-by-count (all books, scoped by year) — CRASHES GraphDB
  # ---------------------------------------------------------------------------
  - id: ex-017
    source: "notes/draftedQueries.txt#Q17"
    question_english: >
      List all books with their title and count of courses, departments, and
      universities that use them in 2022, ordered by university count descending.
    question_greek: "Λίστα όλων των βιβλίων με τίτλο και αριθμό Μαθημάτων, Τμημάτων και Πανεπιστημίων που τα χρησιμοποιούν το 2022, ταξινομημένη φθίνουσα ανά Πανεπιστήμια."
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?bt (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?c) AS ?Courses)
      WHERE {
        ?b a evdx:Book .
        ?b evdx:title ?bt .
        ?c a evdx:Course .
        ?c evdx:hasBook ?b .
        ?c evdx:year 2022 .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      } GROUP BY ?b ?bt
      ORDER BY DESC(?Universities)
    query_shape: ranking-by-count
    granularity: n/a
    comparison_mode: ordered
    skip_eval: true
    few_shot_priority: 99
    notes: >
      KNOWN ISSUE: COUNT(DISTINCT) over the full book graph (48k+ books) exceeds
      the GraphDB 250 MB heap limit and crashes (confirmed pre-migration,
      2026-05-04; the dataset is now larger so this remains true). Gold SPARQL
      is the correct formulation but NOT executable on the current endpoint. A
      subquery rewrite may help but is unverified. Excluded from eval metrics
      until resolved.

