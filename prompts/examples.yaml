            ?c evdx:hasBook ?b .
            ?c evdx:year 2022 .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
