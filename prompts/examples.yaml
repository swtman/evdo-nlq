    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (COUNT(DISTINCT ?d) AS ?NumberOfDepts) (GROUP_CONCAT(?dn;SEPARATOR=", ") AS ?Departments) (COUNT(?c) AS ?NoOfCourses) (GROUP_CONCAT(?ct;SEPARATOR=", ") AS ?Courses)
      WHERE {
        ?c evdx:title ?ct .
