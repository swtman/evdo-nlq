    question_greek: "Ποια Πανεπιστήμια (με στοιχεία Τμημάτων και Μαθημάτων) χρησιμοποίησαν τα βιβλία 102070469 ή 13909 το 2022, ενώ δεν τα χρησιμοποιούσαν το 2021;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?c) AS ?NoOfCourses) (GROUP_CONCAT(?ct;SEPARATOR=", ") AS ?Courses)
      WHERE {
        ?c evdx:title ?ct .
        {
          SELECT DISTINCT ?un ?dn ?c
