            VALUES ?code {"102070469" "13909"}
            ?s evdx:hasCode ?code .
            ?m a evdx:Module .
            ?m evdx:hasBook ?s .
            ?c a evdx:Course .
            ?c evdx:year 2022 .
            ?c evdx:hasModule ?m .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER EXISTS {
              ?m1 a evdx:Module .
              VALUES ?code1 {"94700120"}
              ?s1 evdx:hasCode ?code1 .
              ?m1 evdx:hasBook ?s1 .
              ?c evdx:hasModule ?m1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-intersection-by-book
    granularity: department
    comparison_mode: set
    few_shot_priority: 13
    notes: "Department-level intersection. FILTER EXISTS checks some ?m1 in the same ?c."

  # ---------------------------------------------------------------------------
  # Q14 — set-intersection-by-book (university)
  # ---------------------------------------------------------------------------
  - id: ex-014
    source: "notes/draftedQueries.txt#Q14"
    question_english: >
      Which universities (with department and module details) use BOTH book
      94700120 AND books 102070469 or 13909 in 2022?
    question_greek: "Ποια Πανεπιστήμια (με Τμήματα και Μαθήματα) χρησιμοποιούν ΚΑΙ το βιβλίο 94700120 ΚΑΙ τα βιβλία 102070469 ή 13909 το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (COUNT(DISTINCT ?d) AS ?NumberOfDepts) (GROUP_CONCAT(?dn;SEPARATOR=", ") AS ?Departments) (COUNT(?m) AS ?NoOfModules) (GROUP_CONCAT(?mt;SEPARATOR=", ") AS ?Modules)
      WHERE {
        ?m evdx:title ?mt .
        ?d evdx:name ?dn .
        {
          SELECT DISTINCT ?un ?d ?m
          WHERE {
            ?s a evdx:Book .
            VALUES ?code {"102070469" "13909"}
            ?s evdx:hasCode ?code .
            ?m a evdx:Module .
            ?m evdx:hasBook ?s .
            ?c a evdx:Course .
            ?c evdx:year 2022 .
            ?c evdx:hasModule ?m .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER EXISTS {
              ?m1 a evdx:Module .
              VALUES ?code1 {"94700120"}
              ?s1 evdx:hasCode ?code1 .
              ?m1 evdx:hasBook ?s1 .
              ?c1 a evdx:Course .
              ?c1 evdx:year 2022 .
              ?c1 evdx:hasModule ?m1 .
              ?d1 evdx:hasCourse ?c1 .
              ?u evdx:hasDepartment ?d1 .
            }
          }
        }
      } GROUP BY ?un
    query_shape: set-intersection-by-book
    granularity: university
    comparison_mode: set
    few_shot_priority: 14
    notes: >
      University-level intersection. Output groups by ?un (not ?un ?dn) and
      aggregates departments inside the outer SELECT.

  # ---------------------------------------------------------------------------
  # Q15 — negative-existence (department)
  # ---------------------------------------------------------------------------
  - id: ex-015
    source: "notes/draftedQueries.txt#Q15"
    question_english: >
      Which departments (and their university) have a course in 2022 but no
      assigned modules — i.e. are effectively inactive that year?
    question_greek: "Ποια Τμήματα (με το Πανεπιστήμιό τους) έχουν πρόγραμμα σπουδών το 2022 αλλά δεν έχει ανατεθεί κανένα μάθημα — δηλαδή είναι ανενεργά εκείνη τη χρονιά;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?dn ?un
      WHERE {
        ?c a evdx:Course .
        ?c evdx:year 2022 .
        ?d evdx:hasCourse ?c .
        ?d evdx:name ?dn .
        ?u evdx:hasDepartment ?d .
        ?u evdx:name ?un .
        FILTER NOT EXISTS {
          ?c evdx:hasModule ?m .
        }
      }
    query_shape: negative-existence
    granularity: department
    comparison_mode: set
    few_shot_priority: 2
    notes: >
      Note: evdx:Course is a study programme — NOT a single course offering.
      A "course with no modules" means the programme had no course offerings
      (evdx:Module) that year. This exercises the Course-vs-Module distinction.

  # ---------------------------------------------------------------------------
  # Q16 — negative-existence (university)
  # ---------------------------------------------------------------------------
  - id: ex-016
    source: "notes/draftedQueries.txt#Q16"
    question_english: >
      Which universities had no active modules at all in 2022 — i.e. none of
      their departments offered any course modules that year?
    question_greek: "Ποια Πανεπιστήμια δεν είχαν κανένα ενεργό μάθημα το 2022 — δηλαδή κανένα Τμήμα τους δεν πρόσφερε μαθήματα εκείνη τη χρονιά;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?u ?un
      WHERE {
        ?u a evdx:University .
        ?u evdx:name ?un .
        FILTER NOT EXISTS {
          ?u evdx:hasDepartment ?d .
          ?d evdx:hasCourse ?c .
          ?c evdx:year 2022 .
          ?c evdx:hasModule ?m .
        }
      }
    query_shape: negative-existence
    granularity: university
    comparison_mode: set
    few_shot_priority: 15
    notes: >
      FILTER NOT EXISTS spans the full traversal from ?u through ?d, ?c, ?m.
      University-level variant of ex-015.

  # ---------------------------------------------------------------------------
  # Q17 — ranking-by-count (all books, scoped by year) — CRASHES GraphDB
  # ---------------------------------------------------------------------------
  - id: ex-017
    source: "notes/draftedQueries.txt#Q17"
    question_english: >
      List all books with their title and count of modules, departments, and
      universities that use them in 2022, ordered by university count descending.
    question_greek: "Λίστα όλων των βιβλίων με τίτλο και αριθμό Μαθημάτων, Τμημάτων και Πανεπιστημίων που τα χρησιμοποιούν το 2022, ταξινομημένη φθίνουσα ανά Πανεπιστήμια."
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?bt (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?m) AS ?Modules)
      WHERE {
        ?s a evdx:Book .
        ?s evdx:title ?bt .
        ?m a evdx:Module .
        ?m evdx:hasBook ?s .
        ?c a evdx:Course .
        ?c evdx:year 2022 .
        ?c evdx:hasModule ?m .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      } GROUP BY ?s ?bt
      ORDER BY DESC(?Universities)
    query_shape: ranking-by-count
    granularity: n/a
    comparison_mode: ordered
    skip_eval: true
    few_shot_priority: 99
    notes: >
      KNOWN ISSUE: COUNT(DISTINCT) over the full book graph (40k+ books) exceeds
      the GraphDB 250 MB heap limit and crashes (confirmed 2026-05-04).
      Gold SPARQL is the correct formulation but NOT executable on the current
      endpoint. A subquery rewrite may help but is unverified. Excluded from
      eval metrics until resolved.

  # ---------------------------------------------------------------------------
