    question_greek: "Ποια Μαθήματα (με Τμήμα και Πανεπιστήμιο) χρησιμοποιούν ΚΑΙ το βιβλίο 94700120 ΚΑΙ τα βιβλία 102070469 ή 13909 το 2022;"
