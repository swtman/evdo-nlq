  # ---------------------------------------------------------------------------
  # Q7 — set-difference-by-year (course)
  # ---------------------------------------------------------------------------
  - id: ex-007
    source: "notes/draftedQueries.txt#Q7"
    question_english: >
      Which specific courses (with department and university) were newly
      added for books 102070469 or 13909 in 2022 compared to 2021?
    question_greek: "Ποια συγκεκριμένα Μαθήματα (με Τμήμα και Πανεπιστήμιο) εισήγαγαν για πρώτη φορά τα βιβλία 102070469 ή 13909 το 2022 σε σχέση με το 2021;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?c) AS ?NoOfCourses) (GROUP_CONCAT(?ct;SEPARATOR=", ") AS ?Courses)
      WHERE {
        ?c evdx:title ?ct .
        {
          SELECT DISTINCT ?un ?dn ?c
          WHERE {
            ?b a evdx:Book .
            VALUES ?code { "102070469" "13909" }
            ?b evdx:hasCode ?code .
            ?c a evdx:Course .
            ?c evdx:hasBook ?b .
            ?c evdx:title ?ctitle .
            ?c evdx:year 2022 .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER NOT EXISTS {
              ?c1 a evdx:Course .
              ?c1 evdx:year 2021 .
              ?c1 evdx:title ?ctitle .
              VALUES ?code1 { "102070469" "13909" }
              ?b1 evdx:hasCode ?code1 .
              ?c1 evdx:hasBook ?b1 .
              ?d evdx:hasCourse ?c1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-difference-by-year
    granularity: course
    comparison_mode: set
    few_shot_priority: 3
    notes: >
      Course-level variant. Unlike ex-005/006, this constrains on ?ctitle
      inside FILTER NOT EXISTS — a course offering with the same title must not
      have existed (with one of these books) in 2021. This is a stricter,
      different query than ex-005, since each year's offering is a distinct
      evdx:Course instance.

  # ---------------------------------------------------------------------------
  # Q8 — multi-book-comparison
  # ---------------------------------------------------------------------------
  - id: ex-008
    source: "notes/draftedQueries.txt#Q8"
    question_english: >
      Compare the reach of book group A (codes 94700120, 12867416) vs group B
      (codes 102070469, 13909) in 2022: how many universities, departments,
      and courses use each group?
    question_greek: "Σύγκρινε την εμβέλεια της ομάδας βιβλίων 94700120 και 12867416 με την ομάδα 102070469 και 13909 για το 2022: σε πόσα Πανεπιστήμια, Τμήματα και Μαθήματα χρησιμοποιείται η κάθε ομάδα;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (GROUP_CONCAT(DISTINCT ?code;SEPARATOR=", ") AS ?Book) (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?c) AS ?NoOfCourses)
      WHERE {
        ?b a evdx:Book .
        VALUES (?book ?code) { (1 "94700120") (1 "12867416") (2 "102070469") (2 "13909")}
        ?b evdx:hasCode ?code .
        ?c a evdx:Course .
        ?c evdx:hasBook ?b .
        ?c evdx:year 2022 .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      } GROUP BY ?book
    query_shape: multi-book-comparison
    granularity: n/a
    comparison_mode: set
    few_shot_priority: 10
    notes: >
      Uses a 2-column VALUES tuple (?book ?code) to assign an integer group ID
      to each code, then groups by ?book. Scoped COUNT(DISTINCT) is safe here.

  # ---------------------------------------------------------------------------
  # Q9 — set-difference-by-book (course)
  # ---------------------------------------------------------------------------
  - id: ex-009
    source: "notes/draftedQueries.txt#Q9"
    question_english: >
      Which courses (with department and university) use books 102070469 or
      13909 but NOT book 94700120 in 2022?
    question_greek: "Ποια Μαθήματα (με Τμήμα και Πανεπιστήμιο) χρησιμοποιούν τα βιβλία 102070469 ή 13909 αλλά ΟΧΙ το βιβλίο 94700120 το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?c) AS ?NoOfCourses) (GROUP_CONCAT(?ct;SEPARATOR=", ") AS ?Courses)
      WHERE {
        ?c evdx:title ?ct .
        {
          SELECT DISTINCT ?un ?dn ?c
          WHERE {
            ?b a evdx:Book .
            VALUES ?code {"102070469" "13909"}
            ?b evdx:hasCode ?code .
            ?c a evdx:Course .
            ?c evdx:hasBook ?b .
            ?c evdx:year 2022 .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER NOT EXISTS {
              VALUES ?code1 {"94700120"}
              ?b1 evdx:hasCode ?code1 .
              ?c evdx:hasBook ?b1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-difference-by-book
    granularity: course
    comparison_mode: set
    few_shot_priority: 5
    notes: >
      FILTER NOT EXISTS checks that the same ?c does not also link to the
      excluded book. No alias needed — the course-offering identity is the same.

