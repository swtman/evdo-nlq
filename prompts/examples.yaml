  - id: ex-021
    source: "handwritten (replaces pre-migration ISBN NOT_ANSWERABLE entry)"
    question_english: >
      For the book with code 94700120, what is its title, ISBN, and author(s)?
    question_greek: "Για το βιβλίο με κωδικό 94700120, ποιος είναι ο τίτλος, το ISBN και ο/οι συγγραφέας/είς του;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT DISTINCT ?bt ?isbn ?authors
      WHERE {
        ?b a evdx:Book .
        VALUES ?code { "94700120" }
        ?b evdx:hasCode ?code .
        ?b evdx:title ?bt .
        ?b evdx:isbn ?isbn .
        ?b evdx:authors ?authors .
      }
    query_shape: traversal-lookup
