  # ---------------------------------------------------------------------------
  # Q7 — set-difference-by-year (module)
  # ---------------------------------------------------------------------------
  - id: ex-007
    source: "notes/draftedQueries.txt#Q7"
    question_english: >
      Which specific modules (with department and university) were newly
      added for books 102070469 or 13909 in 2022 compared to 2021?
    question_greek: "Ποια συγκεκριμένα Μαθήματα (με Τμήμα και Πανεπιστήμιο) εισήγαγαν για πρώτη φορά τα βιβλία 102070469 ή 13909 το 2022 σε σχέση με το 2021;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?m) AS ?NoOfModules) (GROUP_CONCAT(?mt;SEPARATOR=", ") AS ?Modules)
      WHERE {
        ?m evdx:title ?mt .
        {
          SELECT DISTINCT ?un ?dn ?m
          WHERE {
            ?s a evdx:Book .
            VALUES ?code { "102070469" "13909" }
            ?s evdx:hasCode ?code .
            ?m a evdx:Module .
            ?m evdx:hasBook ?s .
            ?m evdx:title ?mtitle .
            ?c a evdx:Course .
            ?c evdx:year 2022 .
            ?c evdx:hasModule ?m .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER NOT EXISTS {
              ?c1 evdx:year 2021 .
              ?c1 evdx:hasModule ?m1 .
              ?m1 a evdx:Module .
              VALUES ?code1 { "102070469" "13909" }
              ?s1 evdx:hasCode ?code1 .
              ?m1 evdx:hasBook ?s1 .
              ?m1 evdx:title ?mtitle .
              ?c1 a evdx:Course .
              ?d evdx:hasCourse ?c1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-difference-by-year
    granularity: module
    comparison_mode: set
    few_shot_priority: 9
    notes: >
      Module-level variant. Unlike ex-005/006, this constrains on ?mtitle
      inside FILTER NOT EXISTS — a module with the same title must not have
      existed in 2021. This is a stricter, different query than ex-005.

  # ---------------------------------------------------------------------------
  # Q8 — multi-book-comparison
  # ---------------------------------------------------------------------------
  - id: ex-008
    source: "notes/draftedQueries.txt#Q8"
    question_english: >
      Compare the reach of book group A (codes 94700120, 12867416) vs group B
      (codes 102070469, 13909) in 2022: how many universities, departments,
      and modules use each group?
    question_greek: "Σύγκρινε την εμβέλεια της ομάδας βιβλίων 94700120 και 12867416 με την ομάδα 102070469 και 13909 για το 2022: σε πόσα Πανεπιστήμια, Τμήματα και Μαθήματα χρησιμοποιείται η κάθε ομάδα;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (GROUP_CONCAT(DISTINCT ?code;SEPARATOR=", ") AS ?Book) (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?m) AS ?NoOfModules)
      WHERE {
        ?s a evdx:Book .
        VALUES (?book ?code) { (1 "94700120") (1 "12867416") (2 "102070469") (2 "13909")}
        ?s evdx:hasCode ?code .
        ?m a evdx:Module .
        ?m evdx:hasBook ?s .
        ?c a evdx:Course .
        ?c evdx:year 2022 .
        ?c evdx:hasModule ?m .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      } GROUP BY ?book
    query_shape: multi-book-comparison
    granularity: n/a
    comparison_mode: set
    few_shot_priority: 10
    notes: >
      Uses a 2-column VALUES tuple (?book ?code) to assign an integer group ID
      to each code, then groups by ?book. Scoped COUNT(DISTINCT) is safe here.

  # ---------------------------------------------------------------------------
  # Q9 — set-difference-by-book (module)
  # ---------------------------------------------------------------------------
  - id: ex-009
    source: "notes/draftedQueries.txt#Q9"
    question_english: >
      Which modules (with department and university) use books 102070469 or
      13909 but NOT book 94700120 in 2022?
    question_greek: "Ποια Μαθήματα (με Τμήμα και Πανεπιστήμιο) χρησιμοποιούν τα βιβλία 102070469 ή 13909 αλλά ΟΧΙ το βιβλίο 94700120 το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?m) AS ?NoOfModules) (GROUP_CONCAT(?mt;SEPARATOR=", ") AS ?Modules)
      WHERE {
        ?m evdx:title ?mt .
        {
          SELECT DISTINCT ?un ?dn ?m
          WHERE {
            ?s a evdx:Book .
            VALUES ?code {"102070469" "13909"}
            ?s evdx:hasCode ?code .
            ?m a evdx:Module .
            ?m evdx:hasBook ?s .
            ?c a evdx:Course .
            ?c evdx:year 2022 .
            ?c evdx:hasModule ?m .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER NOT EXISTS {
              VALUES ?code1 {"94700120"}
              ?s1 evdx:hasCode ?code1 .
              ?m evdx:hasBook ?s1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-difference-by-book
    granularity: module
    comparison_mode: set
    few_shot_priority: 5
    notes: >
      FILTER NOT EXISTS checks that the same ?m does not also link to the
      excluded book. No ?m1 alias needed — the module identity is the same.

