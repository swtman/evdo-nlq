# prompts/examples.yaml
# Gold example bank for NL → SPARQL evaluation and static few-shot prompting.
#
# Promoted from notes/draftedQueries.txt (Q1–Q18) + 3 NOT_ANSWERABLE entries.
# NL questions (question_english) taken from the original query descriptions.
# question_greek fields marked "TODO" must be filled in by the author before eval.
#
# MIGRATION NOTE (2026-06-11): all gold_sparql rewritten for the post-overhaul
# EvdoGraph schema. evdx:Module (course offering) was renamed to evdx:Course;
# the old programme-level evdx:Course was removed entirely. The traversal
# collapsed from Book→Module→Course(programme)→Department→University (4 hops)
# to Book→Course→Department→University (3 hops). Consequences for this file:
#   - ex-001 through ex-014, ex-017, ex-018: topology rewritten in place
#     (?m/Module → ?c/Course offering; ?s/?s1 → ?b/?b1 for Book; the dead
#     programme-level ?c/?c1 variable removed, ?d evdx:hasCourse ?c is now
#     direct).
#   - ex-015: REPLACED — the old "programme with no modules" question exercised
#     the now-removed Course/Module distinction. New ex-015 asks "which
#     departments offered no courses in <year>", the natural department-level
#     negative-existence question in the flat schema.
#   - ex-016: topology collapsed (?u→?d→?c→?m, 3 hops) to (?u→?d→?c, 2 hops).
#   - ex-021: REPLACED — evdx:isbn now EXISTS, so the old "ISBN is
#     NOT_ANSWERABLE" gold is false. New ex-021 is an answerable ISBN/authors
#     lookup.
#   - ex-022: NEW — exercises the new evdx:keyword and evdx:hasPublisher /
#     evdx:publisherName properties (topic + publisher lookup).
# See decisions/014-ontology-v2-migration.md for the full schema diff.
#
# Schema reference: decisions/005-eval-methodology.md
# query_shape values: traversal-lookup | multi-level-count | multi-level-aggregate-with-concat |
#   set-difference-by-year | set-difference-by-book | set-intersection-by-book |
#   negative-existence | ranking-by-count | multi-book-comparison | not-answerable
# comparison_mode values: set | ordered | scalar | not-answerable
# skip_eval: true → example excluded from eval metrics (e.g. known GraphDB heap crash)

version: 2
examples:

  # ---------------------------------------------------------------------------
  # Q1 — traversal-lookup
  # ---------------------------------------------------------------------------
  - id: ex-001
    source: "notes/draftedQueries.txt#Q1"
    question_english: >
      Return all courses that use book 94700120 in the academic year 2022,
      along with the department and university.
    question_greek: "Σε ποια μαθήματα χρησιμοποιείται το βιβλίο με κωδικό 94700120 το ακαδημαϊκό έτος 2022; Εμφάνισε και το Τμήμα και το Πανεπιστήμιο."
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT DISTINCT  (?un AS ?University) (?dn AS ?Department) (?ct AS ?Course)
      WHERE {
        ?b a evdx:Book .
        VALUES ?code {"94700120"}
        ?b evdx:hasCode ?code .
        ?c a evdx:Course .
        ?c evdx:title ?ct .
        ?c evdx:hasBook ?b .
        ?c evdx:year 2022 .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?d evdx:name ?dn .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
        ?u evdx:name ?un .
      }
    query_shape: traversal-lookup
    granularity: course
    comparison_mode: set
    few_shot_priority: 1
    notes: >
      Core 3-hop traversal Book→Course→Dept→Uni (collapsed from the old 4-hop
      Book→Module→Course→Dept→Uni chain after the 2026-06-11 schema migration —
      evdx:Course is now the course offering and carries evdx:year directly).
      Multiple book codes can be listed inside VALUES (e.g. different editions).

  # ---------------------------------------------------------------------------
  # Q2 — multi-level-aggregate-with-concat
  # ---------------------------------------------------------------------------
  - id: ex-002
    source: "notes/draftedQueries.txt#Q2"
    question_english: >
      How many courses use books 102070469 or 13909 in 2022, and what are
      their names? Group by department.
    question_greek: "Πόσα μαθήματα χρησιμοποιούν τα βιβλία 102070469 ή 13909 το 2022 και ποιες είναι οι ονομασίες τους; Ομαδοποίησε ανά Τμήμα."
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?c) AS ?NoOfCourses) (GROUP_CONCAT(?ct;SEPARATOR=", ") AS ?Courses)
      WHERE {
        ?c evdx:title ?ct .
        {
          SELECT DISTINCT ?un ?dn ?c
          WHERE {
            ?b a evdx:Book .
            VALUES ?code { "102070469" "13909" }
            ?b evdx:hasCode ?code .
            ?c a evdx:Course .
            ?c evdx:hasBook ?b .
            ?c evdx:year 2022 .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
          }
        }
      } GROUP BY ?un ?dn
    query_shape: multi-level-aggregate-with-concat
    granularity: department
    comparison_mode: set
    few_shot_priority: 2
    notes: >
      Uses inner SELECT DISTINCT + outer GROUP_CONCAT to avoid duplicate
      ?ct bindings. The inner subquery deduplicates courses before aggregation.

  # ---------------------------------------------------------------------------
  # Q3 — multi-level-count (scalar)
  # ---------------------------------------------------------------------------
  - id: ex-003
    source: "notes/draftedQueries.txt#Q3"
    question_english: >
      In how many courses, departments, and universities are books 102070469
      and 13909 used in 2022?
    question_greek: "Σε πόσα μαθήματα, Τμήματα και Πανεπιστήμια χρησιμοποιούνται τα βιβλία με κωδικούς 102070469 και 13909 το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?c) AS ?NoOfCourses)
      WHERE {
        ?b a evdx:Book .
        VALUES ?code { "102070469" "13909" }
        ?b evdx:hasCode ?code .
        ?c a evdx:Course .
        ?c evdx:hasBook ?b .
        ?c evdx:year 2022 .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      }
    query_shape: multi-level-count
    granularity: n/a
    comparison_mode: scalar
    few_shot_priority: 3
    notes: >
      COUNT(DISTINCT) is allowed here because the result is scoped by VALUES ?code.
      Pre-migration version confirmed working against live GraphDB (2026-05-04);
      re-verify against EvdoGraph once the endpoint recovers.

  # ---------------------------------------------------------------------------
  # Q4 — multi-level-count (ordered, by year range)
  # ---------------------------------------------------------------------------
  - id: ex-004
    source: "notes/draftedQueries.txt#Q4"
    question_english: >
      In how many courses, departments, and universities are books 94700120
      and 12867416 used, broken down per year for 2019–2022?
    question_greek: "Σε πόσα μαθήματα, Τμήματα και Πανεπιστήμια χρησιμοποιούνται τα βιβλία 94700120 και 12867416 ανά ακαδημαϊκό έτος από το 2019 έως το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?year (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?c) AS ?NoOfCourses)
      WHERE {
        ?b a evdx:Book .
        VALUES ?code { "94700120" "12867416" }
        ?b evdx:hasCode ?code .
        ?c a evdx:Course .
        ?c evdx:hasBook ?b .
        ?c evdx:year ?year .
        FILTER ((?year >= 2019) && (?year < 2023)) .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      } GROUP BY ?year
        ORDER BY ?year
    query_shape: multi-level-count
    granularity: n/a
    comparison_mode: ordered
    few_shot_priority: 7
    notes: >
      Year is an integer, now a direct property of evdx:Course (the offering).
      FILTER uses >= and < (not <=) for the upper bound. ORDER BY ?year makes
      this an ordered comparison.

  # ---------------------------------------------------------------------------
  # Q5 — set-difference-by-year (department)
  # ---------------------------------------------------------------------------
  - id: ex-005
    source: "notes/draftedQueries.txt#Q5"
    question_english: >
      Which departments (with university and course details) adopted books
      102070469 or 13909 in 2022 that did not use them in 2021?
    question_greek: "Ποια Τμήματα (με στοιχεία Πανεπιστημίου και Μαθημάτων) χρησιμοποίησαν τα βιβλία 102070469 ή 13909 το 2022, ενώ δεν τα χρησιμοποιούσαν το 2021;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?c) AS ?NoOfCourses) (GROUP_CONCAT(?ct;SEPARATOR=", ") AS ?Courses)
      WHERE {
        ?c evdx:title ?ct .
        {
          SELECT DISTINCT ?un ?dn ?c
          WHERE {
            ?b a evdx:Book .
            VALUES ?code {"102070469" "13909"}
            ?b evdx:hasCode ?code .
            ?c a evdx:Course .
            ?c evdx:hasBook ?b .
            ?c evdx:year 2022 .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER NOT EXISTS {
              ?c1 a evdx:Course .
              VALUES ?code1 { "102070469" "13909" }
              ?b1 evdx:hasCode ?code1 .
              ?c1 evdx:hasBook ?b1 .
              ?c1 evdx:year 2021 .
              ?d evdx:hasCourse ?c1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-difference-by-year
    granularity: department
    comparison_mode: set
    few_shot_priority: 4
    notes: >
      The outer query is year 2022; FILTER NOT EXISTS checks the same ?d
      had no course offering with this book in 2021 (?d evdx:hasCourse ?c1
      directly — the old hasModule indirection is gone). Swap years to get
      departments removed from 2021→2022.

