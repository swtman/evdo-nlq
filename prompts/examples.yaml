# prompts/examples.yaml
# Gold example bank for NL → SPARQL evaluation and static few-shot prompting.
#
# Promoted from notes/draftedQueries.txt (Q1–Q18) + 3 NOT_ANSWERABLE entries.
# NL questions (question_english) taken from the original query descriptions.
# question_greek fields marked "TODO" must be filled in by the author before eval.
#
# Schema reference: decisions/005-eval-methodology.md
# query_shape values: traversal-lookup | multi-level-count | multi-level-aggregate-with-concat |
#   set-difference-by-year | set-difference-by-book | set-intersection-by-book |
#   negative-existence | ranking-by-count | multi-book-comparison | not-answerable
# comparison_mode values: set | ordered | scalar | not-answerable
# skip_eval: true → example excluded from eval metrics (e.g. known GraphDB heap crash)

version: 1
examples:

  # ---------------------------------------------------------------------------
  # Q1 — traversal-lookup
  # ---------------------------------------------------------------------------
  - id: ex-001
    source: "notes/draftedQueries.txt#Q1"
    question_english: >
      Return all modules that use book 94700120 in the academic year 2022,
      along with the department and university.
    question_greek: "Σε ποια μαθήματα χρησιμοποιείται το βιβλίο με κωδικό 94700120 το ακαδημαϊκό έτος 2022; Εμφάνισε και το Τμήμα και το Πανεπιστήμιο."
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (?mt AS ?Module)
      WHERE {
        ?s a evdx:Book .
        VALUES ?code {"94700120"}
        ?s evdx:hasCode ?code .
        ?m a evdx:Module .
        ?m evdx:title ?mt .
        ?m evdx:hasBook ?s .
        ?c a evdx:Course .
        ?c evdx:year 2022 .
        ?c evdx:hasModule ?m .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?d evdx:name ?dn .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
        ?u evdx:name ?un .
      }
    query_shape: traversal-lookup
    granularity: module
    comparison_mode: set
    few_shot_priority: 1
    notes: >
      Core 4-hop traversal Book→Module→Course→Dept→Uni. Multiple book codes
      can be listed inside VALUES (e.g. different editions).

  # ---------------------------------------------------------------------------
  # Q2 — multi-level-aggregate-with-concat
  # ---------------------------------------------------------------------------
  - id: ex-002
    source: "notes/draftedQueries.txt#Q2"
    question_english: >
      How many modules use books 102070469 or 13909 in 2022, and what are
      their names? Group by department.
    question_greek: "Πόσα μαθήματα χρησιμοποιούν τα βιβλία 102070469 ή 13909 το 2022 και ποιες είναι οι ονομασίες τους; Ομαδοποίησε ανά Τμήμα."
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?m) AS ?NoOfModules) (GROUP_CONCAT(?mt;SEPARATOR=", ") AS ?Modules)
      WHERE {
        ?m evdx:title ?mt .
        {
          SELECT DISTINCT ?un ?dn ?m
          WHERE {
            ?s a evdx:Book .
            VALUES ?code { "102070469" "13909" }
            ?s evdx:hasCode ?code .
            ?m a evdx:Module .
            ?m evdx:hasBook ?s .
            ?c a evdx:Course .
            ?c evdx:year 2022 .
            ?c evdx:hasModule ?m .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
          }
        }
      } GROUP BY ?un ?dn
    query_shape: multi-level-aggregate-with-concat
    granularity: department
    comparison_mode: set
    few_shot_priority: 2
    notes: >
      Uses inner SELECT DISTINCT + outer GROUP_CONCAT to avoid duplicate
      ?mt bindings. The inner subquery deduplicates modules before aggregation.

  # ---------------------------------------------------------------------------
  # Q3 — multi-level-count (scalar)
  # ---------------------------------------------------------------------------
  - id: ex-003
    source: "notes/draftedQueries.txt#Q3"
    question_english: >
      In how many modules, departments, and universities are books 102070469
      and 13909 used in 2022?
    question_greek: "Σε πόσα μαθήματα, Τμήματα και Πανεπιστήμια χρησιμοποιούνται τα βιβλία με κωδικούς 102070469 και 13909 το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?m) AS ?NoOfModules)
      WHERE {
        ?s a evdx:Book .
        VALUES ?code { "102070469" "13909" }
        ?s evdx:hasCode ?code .
        ?m a evdx:Module .
        ?m evdx:hasBook ?s .
        ?c a evdx:Course .
        ?c evdx:year 2022 .
        ?c evdx:hasModule ?m .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      }
    query_shape: multi-level-count
    granularity: n/a
    comparison_mode: scalar
    few_shot_priority: 3
    notes: >
      COUNT(DISTINCT) is allowed here because the result is scoped by VALUES ?code.
      Confirmed working against live GraphDB (2026-05-04).

  # ---------------------------------------------------------------------------
  # Q4 — multi-level-count (ordered, by year range)
  # ---------------------------------------------------------------------------
  - id: ex-004
    source: "notes/draftedQueries.txt#Q4"
    question_english: >
      In how many modules, departments, and universities are books 94700120
      and 12867416 used, broken down per year for 2019–2022?
    question_greek: "Σε πόσα μαθήματα, Τμήματα και Πανεπιστήμια χρησιμοποιούνται τα βιβλία 94700120 και 12867416 ανά ακαδημαϊκό έτος από το 2019 έως το 2022;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT ?year (COUNT(DISTINCT ?u) AS ?Universities) (COUNT(DISTINCT ?d) AS ?Departments) (COUNT(DISTINCT ?m) AS ?NoOfModules)
      WHERE {
        ?s a evdx:Book .
        VALUES ?code { "94700120" "12867416" }
        ?s evdx:hasCode ?code .
        ?m a evdx:Module .
        ?m evdx:hasBook ?s .
        ?c a evdx:Course .
        ?c evdx:year ?year .
        FILTER ((?year >= 2019) && (?year < 2023)) .
        ?c evdx:hasModule ?m .
        ?d a evdx:Department .
        ?d evdx:hasCourse ?c .
        ?u a evdx:University .
        ?u evdx:hasDepartment ?d .
      } GROUP BY ?year
        ORDER BY ?year
    query_shape: multi-level-count
    granularity: n/a
    comparison_mode: ordered
    few_shot_priority: 7
    notes: >
      Year is an integer. FILTER uses >= and < (not <=) for the upper bound.
      ORDER BY ?year makes this an ordered comparison.

  # ---------------------------------------------------------------------------
  # Q5 — set-difference-by-year (department)
  # ---------------------------------------------------------------------------
  - id: ex-005
    source: "notes/draftedQueries.txt#Q5"
    question_english: >
      Which departments (with university and module details) adopted books
      102070469 or 13909 in 2022 that did not use them in 2021?
    question_greek: "Ποια Τμήματα (με στοιχεία Πανεπιστημίου και Μαθημάτων) χρησιμοποίησαν τα βιβλία 102070469 ή 13909 το 2022, ενώ δεν τα χρησιμοποιούσαν το 2021;"
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (?un AS ?University) (?dn AS ?Department) (COUNT(?m) AS ?NoOfModules) (GROUP_CONCAT(?mt;SEPARATOR=", ") AS ?Modules)
      WHERE {
        ?m evdx:title ?mt .
        {
          SELECT DISTINCT ?un ?dn ?m
          WHERE {
            ?s a evdx:Book .
            VALUES ?code {"102070469" "13909"}
            ?s evdx:hasCode ?code .
            ?m a evdx:Module .
            ?m evdx:hasBook ?s .
            ?c a evdx:Course .
            ?c evdx:year 2022 .
            ?c evdx:hasModule ?m .
            ?d a evdx:Department .
            ?d evdx:hasCourse ?c .
            ?d evdx:name ?dn .
            ?u a evdx:University .
            ?u evdx:hasDepartment ?d .
            ?u evdx:name ?un .
            FILTER NOT EXISTS {
              ?m1 a evdx:Module .
              VALUES ?code1 { "102070469" "13909" }
              ?s1 evdx:hasCode ?code1 .
              ?m1 evdx:hasBook ?s1 .
              ?c1 a evdx:Course .
              ?c1 evdx:year 2021 .
              ?c1 evdx:hasModule ?m1 .
              ?d evdx:hasCourse ?c1 .
            }
          }
        }
      } GROUP BY ?un ?dn
    query_shape: set-difference-by-year
    granularity: department
    comparison_mode: set
    few_shot_priority: 4
    notes: >
      The outer query is year 2022; FILTER NOT EXISTS checks the same ?d
      had no course with this book in 2021. Swap years to get departments
      removed from 2021→2022.

