# Department ↔ university eval set (title-linking plan, branch 3; ADR-028).
#
# Eval-only gold file — NOT a few-shot bank. Run with
#   uv run python scripts/eval.py --examples-file ../prompts/eval-departments.yaml
# Production few-shot examples still come from prompts/examples.yaml, so nothing
# here can leak into the prompt.
#
# Purpose: an answer-level before/after check of branch 3 (decision 8). Every
# question names a department whose EXACT label exists at several universities:
#   dept-named-*  — asked at a university that is NOT the alphabetically first
#                   one with that label. Before branch 3 the hint kept only the
#                   first, so for these 12 it named a different university
#                   than the question did.
#   dept-absent-* — the university has no department with that name (gold 0,
#                   negative existence): the hint must not make the model
#                   borrow another university's department.
#   dept-bare-*   — no university named; labels with a single surface form (no
#                   "(…)" variants), so "how many universities" is unambiguous.
#                   Before branch 3 the hint listed one of them.
# Counts, not lists, so presentation (column order, grouping) cannot decide a
# pass — every item is comparison_mode: scalar.
#
# Data: candidates and gold numbers from S29
# (notes/investigations/title-linking/results/s29_dept_course_counts.txt,
# data/dept_course_counts_2022.json, GraphDB 2026-09-25). Generated, not real
# user questions (decision 3 limitation). Greek only (ADR-033, 2026-09-26).

version: 1
examples:
  - id: dept-named-01
    question_greek: Πόσα μαθήματα είχε το 2022 το Τμήμα Οικονομικών Επιστημών του Πανεπιστημίου Πελοποννήσου;
    gold_sparql: |
      PREFIX evdx: <https://w3id.org/evdoxus#>
      SELECT (COUNT(DISTINCT ?c) AS ?NoOfCourses)
      WHERE {
        ?u a evdx:University .
        ?u evdx:name "ΠΑΝΕΠΙΣΤΗΜΙΟ ΠΕΛΟΠΟΝΝΗΣΟΥ" .
        ?u evdx:hasDepartment ?d .
        ?d a evdx:Department .
        ?d evdx:name "ΟΙΚΟΝΟΜΙΚΩΝ ΕΠΙΣΤΗΜΩΝ" .
        ?d evdx:hasCourse ?c .
        ?c a evdx:Course .
        ?c evdx:year 2022 .
      }
    query_shape: department-course-count
    granularity: department
    comparison_mode: scalar
    few_shot_priority: 99
    notes: Label at 11 universities; gold 71 (S29).

