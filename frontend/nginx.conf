server {
    listen 5173;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with cache headers
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /providers to backend (short-lived, can be buffered)
    location /providers {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Proxy /query (sync endpoint)
    location = /query {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Proxy /sparql/* (raw SPARQL execute — plain sync JSON, no SSE)
    location /sparql {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Proxy /query/stream (SSE — must NOT buffer)
    location /query/stream {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
        # Required for SSE over HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # SPA fallback: all unknown paths serve index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
