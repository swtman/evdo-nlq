[project]
name = "backend"
version = "0.1.0"
description = "EvdoGraph NLQ backend — FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.49.0",
    "fastapi[standard]>=0.136.0",
    "google-genai>=1.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "rdflib>=7.6.0",
    "sparqlwrapper>=2.0.0",
    "sse-starlette>=2.0.0",
    "uvicorn[standard]>=0.45.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: marks tests requiring live API keys and network (skip with '-m not live')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
